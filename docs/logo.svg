<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="Plugflow">
  <title>Plugflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f1f23"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="flow" x1="120" y1="360" x2="392" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- flow line: from a node, through a curve, into a plug -->
  <path d="M148 356c72 0 60-136 132-136h36" stroke="url(#flow)" stroke-width="34" stroke-linecap="round"/>
  <circle cx="148" cy="356" r="38" fill="#09090b" stroke="url(#flow)" stroke-width="30"/>
  <!-- plug -->
  <rect x="306" y="162" width="74" height="116" rx="26" fill="#fafafa"/>
  <rect x="372" y="186" width="54" height="22" rx="11" fill="#fafafa"/>
  <rect x="372" y="232" width="54" height="22" rx="11" fill="#fafafa"/>
</svg>
